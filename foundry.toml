[profile.default]
src = "contracts"
out = "out"
libs = ["node_modules", "lib"]
evm_version = "cancun"
remappings = [
  "@chainlink/=node_modules/@chainlink/"
]

[profile.default.fuzz]
runs = 5000

[rpc_endpoints]
scroll_sepolia = "${SCROLL_RPC_URL}"
battlechain = "${BATTLECHAIN_RPC_URL}"

[etherscan]
scroll_sepolia = { key = "${SCROLLSCAN_API_KEY}", url = "https://api-sepolia.scrollscan.com/api" }
battlechain = { key = "${BATTLECHAIN_API_KEY}", url = "https://explorer.battlechain.com/api" }
